# =============================================================================
# Render Blueprint — SPT App Project (Entorno de Preproducción: 'pre')
# Despliegue 100% Free Tier: 1 Web Service (Node/NestJS) + 4 Static Sites (Angular)
# =============================================================================
services:
  # ─── 1. Backend API (NestJS + Prisma + Neon) ──────────────────────────────
  - type: web
    name: spt-backend-pre
    runtime: node
    plan: free
    region: frankfurt # Misma región eu-central-1 que Neon para latencia mínima
    branch: develop
    buildCommand: npm install && cd apps/backend && npx prisma generate && npm run build
    startCommand: cd apps/backend && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://spt-app-pre.onrender.com,https://spt-mfe-admin-pre.onrender.com,https://spt-mfe-portal-pre.onrender.com,https://spt-mfe-users-pre.onrender.com

  # ─── 2. Shell Host (Angular Native Federation) ─────────────────────────────
  - type: web
    name: spt-app-pre
    runtime: static
    branch: develop
    buildCommand: npm install && cd apps/frontend && npx ng build spt-app
    staticPublishPath: apps/frontend/dist/spt-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── 3. Microfrontend Admin (spt-admin) ───────────────────────────────────
  - type: web
    name: spt-mfe-admin-pre
    runtime: static
    branch: develop
    buildCommand: npm install && cd apps/frontend && npx ng build spt-admin
    staticPublishPath: apps/frontend/dist/spt-admin/browser
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── 4. Microfrontend Portal de Reservas (spt-portal) ───────────────────────
  - type: web
    name: spt-mfe-portal-pre
    runtime: static
    branch: develop
    buildCommand: npm install && cd apps/frontend && npx ng build spt-portal
    staticPublishPath: apps/frontend/dist/spt-portal/browser
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── 5. Microfrontend Usuarios y Auth (spt-users) ──────────────────────────
  - type: web
    name: spt-mfe-users-pre
    runtime: static
    branch: develop
    buildCommand: npm install && cd apps/frontend && npx ng build spt-users
    staticPublishPath: apps/frontend/dist/spt-users/browser
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
