name: SPT Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-specs:
    name: Lint & OpenSpec Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenSpec specs
        run: npm run spec:check

      - name: Run Backend Linter (ESLint)
        run: npm run lint

  backend-ci:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/spt_ci_db'
      JWT_ACCESS_SECRET: 'ci-secret-access-token-key-32-chars-min'
      JWT_REFRESH_SECRET: 'ci-secret-refresh-token-key-32-chars-min'
      CORS_ORIGINS: 'http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/backend && npx prisma generate

      - name: Run Backend Unit Tests (Jest)
        run: npm run test:backend

      - name: Compile Backend (NestJS)
        run: npm run build:backend

  frontend-ci:
    name: Frontend Tests & Microfrontends Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Unit Tests (Vitest)
        run: npm run test:frontend

      - name: Build All Microfrontends (Native Federation)
        run: npm run build:all
